services:
  civilbot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: ["./data:/data", "./backups:/backups"]
    ports: ["8080:8080"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 3g}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
