<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>CivilBot | المهندس المدني</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <button id="back" class="icon hidden" aria-label="رجوع">→</button>
  <h1 id="title">👷‍♂️ CivilBot</h1>
  <button id="histBtn" class="icon" aria-label="السجل">🕘</button>
</header>
<div id="offline" class="banner hidden">📴 أنت غير متصل. الحسابات تحتاج إنترنت، والسجل متاح.</div>

<main>
  <section id="home">
    <input id="search" type="search" placeholder="🔎 ابحث عن أداة: كمرة، قاعدة، مور…" autocomplete="off">
    <div id="cats"></div>
  </section>

  <section id="tool" class="hidden">
    <details id="helpBox"><summary>📖 طريقة الإدخال والأمثلة</summary><div id="help"></div></details>
    <p id="desc" class="desc"></p>
    <div id="form" class="form hidden"></div>
    <div id="examples" class="chips"></div>
    <details id="rawBox" open><summary id="rawSum">✍️ المدخلات بسطر واحد</summary>
      <div id="textWrap">
        <textarea id="input" rows="3" dir="ltr" placeholder="L=6 type=ss w=20"></textarea>
      </div>
    </details>
    <div id="photoWrap" class="hidden">
      <label class="file">📷 التقط صورة أو اختر من المعرض<input id="photo" type="file" accept="image/*" capture="environment"></label>
      <img id="preview" class="hidden" alt="">
      <input id="caption" type="text" placeholder="ملاحظة اختيارية (مثلاً: span=5 أو جدار خارجي)">
    </div>
    <button id="run" class="primary">⚡ احسب</button>
    <div id="status"></div>
    <div id="result"></div>
  </section>

  <section id="history" class="hidden"><div id="histList"></div></section>
</main>

<footer class="note">النتائج أداة مساعدة، والمسؤولية الهندسية على المهندس المعتمد · <a href="https://t.me/phq8bot">بوت تلجرام</a></footer>
<script src="app.js"></script>
</body>
</html>
